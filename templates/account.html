<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Account — SIENE</title>
        <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}" />
    </head>

    <body>
        <video autoplay muted loop id="bg-video">
            <source src="{{ url_for('static', filename='background.mp4') }}" type="video/mp4" />
        </video>

        <div class="page-content">
            <div class="app">
                <h1>Account</h1>
                <p class="subtitle">Manage your account details</p>

                {% if error %}
                    <p class="error">{{ error }}</p>
                {% endif %}
                {% if success %}
                    <p class="success">{{ success }}</p>
                {% endif %}

                        <section class="account-section">
                            <h2>Change username</h2>
                            <form method="post" class="auth-form">
                        <input type="hidden" name="action" value="update_username" />
                        <label class="visually-hidden" for="new-username">New username</label>
                        <input id="new-username" type="text" name="username" placeholder="New username" autocomplete="username" />

                                <div style="margin-top:0.6rem;">
                                    <button type="submit" class="glass-btn primary-light">Update username</button>
                        </div>
                    </form>
                </section>

                <hr />

                        <section class="account-section">
                            <h2>Change password</h2>
                            <form method="post" class="auth-form">
                        <input type="hidden" name="action" value="update_password" />
                        <label class="visually-hidden" for="current_password">Current password</label>
                        <input id="current_password" type="password" name="current_password" placeholder="Current password" autocomplete="current-password" />

                        <label class="visually-hidden" for="new_password">New password</label>
                        <input id="new_password" type="password" name="new_password" placeholder="New password" autocomplete="new-password" />

                        <label class="visually-hidden" for="confirm_password">Confirm password</label>
                        <input id="confirm_password" type="password" name="confirm_password" placeholder="Confirm new password" autocomplete="new-password" />

                                    <div style="margin-top:0.6rem;">
                                        <button type="submit" class="glass-btn primary-light">Update password</button>
                                    </div>
                    </form>
                </section>

                <hr />

                <section class="account-section">
                    <h2>Danger zone</h2>
                    <p class="muted">Deleting your account will remove all your tasks and cannot be undone.</p>
                                <form method="post" class="auth-form">
                        <input type="hidden" name="action" value="delete_account" />
                        <label class="visually-hidden" for="confirm">Type DELETE to confirm</label>
                        <input id="confirm" type="text" name="confirm" placeholder="Type DELETE to confirm" />
                        <div style="margin-top:0.6rem; display:flex; gap:0.6rem;">
                            <button type="submit" class="glass-btn" style="background:linear-gradient(135deg, rgba(239,68,68,0.9), rgba(127,29,29,0.9)); border-color:rgba(239,68,68,0.8);">Delete account</button>
                            <a class="glass-btn" href="{{ url_for('index') }}">Back</a>
                        </div>
                    </form>
                </section>

            </div>
        </div>
    </body>
</html>
