<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>{{ title or "To-Do List" }}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}" />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <!-- Glassy top bar with hamburger -->
    <header class="top-bar">
      <div class="top-bar__title">SIENE</div>

      <div class="top-bar__right">
        <span class="top-bar__username">
          {% if session.username %}
            Logged in as {{ session.username }}
          {% else %}
            Not logged in
          {% endif %}
        </span>

        <button
          class="hamburger"
          id="hamburger"
          type="button"
          aria-label="Open menu"
        >
          <span></span>
          <span></span>
          <span></span>
        </button>

        <nav class="hamburger-menu" id="hamburger-menu">
          <a href="{{ url_for('account') }}">View account</a>
          <a href="{{ url_for('logout') }}">Logout</a>
        </nav>
      </div>
    </header>


    <!-- Background video -->
    <video autoplay muted loop id="bg-video">
      <source src="{{ url_for('static', filename='background.mp4') }}" type="video/mp4" />
    </video>

    <!-- Everything else goes ABOVE the video -->
    <div class="page-content">
      <div class="app">
        <h1>my tasks</h1>
        <p class="subtitle">plan your day and future tasks🪼</p>
        <p id="today" class="today"></p>

        <!-- Input row -->
        <div class="input-row">
          <input id="newText" type="text" placeholder="add a task..." />

          <input id="dueDate" type="date" />

          <select id="category">
            <option value="">no category</option>
            <option value="personal">personal</option>
            <option value="school">school</option>
            <option value="work">work</option>
          </select>

          <button id="addBtn">add</button>
        </div>

        <p id="counter" class="counter"></p>

        <div class="filters">
          <button type="button" data-filter="all" class="active">All</button>
          <button type="button" data-filter="active">Active</button>
          <button type="button" data-filter="done">Done</button>
        </div>

        <ul id="list"></ul>

        <button id="clearCompleted" type="button" class="clear-btn">
          Clear completed
        </button>
      </div>
    </div>

     <!-- JS for the todo app -->
    <script src="{{ url_for('static', filename='app.js') }}"></script>

    <!-- Hamburger menu handlers moved to `static/app.js` to avoid duplicate listeners -->
    <!-- Inline script removed. See `static/app.js` for the implementation. -->
  </body>
</html>
