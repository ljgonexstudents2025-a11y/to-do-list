<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Login — SIENE</title>
        <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}" />
    </head>

    <body>
        <video autoplay muted loop id="bg-video">
            <source src="{{ url_for('static', filename='background.mp4') }}" type="video/mp4" />
        </video>

        <div class="page-content">
            <div class="app">
                <h1>Log in</h1>
                <p class="subtitle">Welcome back!</p>

                {% if error %}
                    <p class="error">{{ error }}</p>
                {% endif %}

                <form method="post" class="auth-form">
                    <label for="username" class="visually-hidden">Username</label>
                    <input id="username" type="text" name="username" placeholder="Username" autocomplete="username" required />

                    <label for="password" class="visually-hidden">Password</label>
                    <input id="password" type="password" name="password" placeholder="Password" autocomplete="current-password" required />

                    <div class="auth-actions">
                        <button type="submit" class="glass-btn primary">Login</button>
                        <a class="glass-btn" href="{{ url_for('signup') }}">Sign up</a>
                    </div>
                </form>

                <p class="muted">
                    Don't have an account? <a href="{{ url_for('signup') }}"> Let's create one</a>
                </p>
            </div>
        </div>
    </body>
</html>
