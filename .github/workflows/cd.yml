name: CD

on:
  push:
    branches: ["main"]   # only deploy when pushing to main

jobs:
  build-test-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1) Get code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2) Set up Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 3) Install dependencies (for tests + app)
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      # 4) Run tests with coverage (must be >= 70%)
      - name: Run tests with coverage (must be >= 70%)
        run: |
          pytest --cov=server \
                 --cov-report=term-missing \
                 --cov-fail-under=70

      # 5) Debug the Docker image tag
      - name: Debug image tag
        run: |
          echo "Docker image tag: ${{ secrets.DOCKER_USERNAME }}/todo-list:latest"

      # 6) Set up Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 7) Log in to Docker registry
      - name: Log in to Docker registry
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      # 8) Build and push Docker image
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/ledian-todo-list:latest

      # 9) Login to Azure
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: List all Azure Web Apps
        run: |
          az webapp list --query "[].{name:name}" -o table

      # 10) Verify Azure account (sanity check)
      - name: Verify Azure account
        run: |
          echo "Current Azure subscription:"
          az account show

      # 11) Deploy the Docker image to Azure Web App
      - name: Deploy to Azure Web App (container)
        uses: azure/webapps-deploy@v2
        with:
          app-name: ledian-to-do-list-app
          images: ${{ secrets.DOCKER_USERNAME }}/ledian-todo-list:latest
