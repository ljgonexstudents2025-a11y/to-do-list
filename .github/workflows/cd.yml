name: CD

on:
  push:
    branches: [ "main" ]   # ✅ ONLY main triggers deployment

jobs:
  build-test-and-deploy:
    runs-on: ubuntu-latest

    steps:
    # 1) Get your code
    - name: Checkout code
      uses: actions/checkout@v4

    # 2) Set up Python
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    # 3) Install dependencies (for tests + app)
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov

    # 4) Run tests with coverage (must be >= 70%)
    - name: Run tests with coverage (must be >= 70%)
      run: |
        pytest --cov=server \
               --cov-report=term-missing \
               --cov-fail-under=70

    # 5) Build & push Docker image (to Docker Hub or another registry)
    - name: Debug image tag
      run: echo "Docker image tag: ${{ secrets.DOCKER_USERNAME }}/todo-list:latest"

    # 5) Build & push Docker image (to Docker Hub or another registry)
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Docker registry
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_TOKEN }}

    - name: Build and push Docker image
      uses: docker/build-push-action@v6
      with:
        context: .
        push: true
        tags: lediangonzalezie/todo-list:latest

    # 6) Login to Azure with the service principal (AZURE_CREDENTIALS)
    - name: Azure Login
      uses: azure/login@v2
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    - name: Verify Azure account (sanity check)
      run: |
        echo "Current Azure subscription:"
        az account show

    # 7) Deploy the Docker image to Azure Web App (or whatever service your teacher chose)
    - name: Deploy to Azure Web App (container)
      uses: azure/webapps-deploy@v2
      with:
        app-name: ledian-to-do-list-app       # name of your Azure Web App
        images: ${{ secrets.DOCKER_USERNAME }}/todo-list:latest
