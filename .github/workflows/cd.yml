name: CD

on:
  push:
    branches: [ "main" ]    # 🚨 ONLY main triggers deployment

jobs:
  build-test-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install dependencies
    # This re-runs tests in the CD pipeline to satisfy
    # "pipeline must run tests, measure coverage, and build".
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov

    - name: Run tests with coverage (must be >= 70%)
      run: |
        pytest --cov=server \
               --cov-report=term-missing \
               --cov-fail-under=70

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Docker registry
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_TOKEN }}

    - name: Build and push Docker image
      uses: docker/build-push-action@v6
      with:
        context: .
        push: true
        tags: ${{ secrets.DOCKER_USERNAME }}/todo-list:latest

    - name: Trigger cloud deployment
      env:
        DEPLOY_WEBHOOK_URL: ${{ secrets.DEPLOY_WEBHOOK_URL }}
      run: |
        echo "Triggering deployment on cloud platform..."
        curl -X POST "$DEPLOY_WEBHOOK_URL"
